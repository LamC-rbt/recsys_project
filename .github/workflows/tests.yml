on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests with pytest
        run: PYTHONPATH=. pytest -v

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare files and directories for Docker build
        run: |
          # For ml-app image
          mkdir -p checkpoints
          touch checkpoints/best_model.pt

          mkdir -p datasets/MovieLens_Large
          touch datasets/MovieLens_Large/dataset_stats.json

          # For TorchServe image
          mkdir -p torchserve/model-store

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build offline inference image
        run: |
          docker build -t ml-app:v1 -f Dockerfile .

      - name: Build TorchServe image
        run: |
          docker build -t sasrec-serve:v1 -f torchserve/Dockerfile.torchserve .
